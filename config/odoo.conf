[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Database
db_host = db
db_port = 5432
db_user = odoo
db_name = False

; Security
admin_passwd = False
list_db = False

; HTTP
http_port = 8069
http_interface = 0.0.0.0
proxy_mode = False

; Workers
workers = 0
max_cron_threads = 1

; Logging
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO
